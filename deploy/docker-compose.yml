# Self-hosted webssh behind Caddy (automatic HTTPS).
#   1. Point a DNS record (e.g. ssh.example.com) at this machine.
#   2. Set WEBSSH_DOMAIN below or in a .env file next to this file.
#   3. docker compose -f deploy/docker-compose.yml up -d --build
#   4. Open https://<domain> and create the owner account (sign-up closes after that).
services:
  webssh:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # Allow connecting to private/LAN hosts (homelab). Set to false on a
      # shared or internet-facing gateway you don't fully control.
      WEBSSH_ALLOW_PRIVATE: "true"
    volumes:
      - webssh-data:/data
    # Not published: only Caddy can reach it.
    expose:
      - "7022"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [webssh]
    environment:
      WEBSSH_DOMAIN: ${WEBSSH_DOMAIN:?set WEBSSH_DOMAIN, e.g. ssh.example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  webssh-data:
  caddy-data:
  caddy-config:
